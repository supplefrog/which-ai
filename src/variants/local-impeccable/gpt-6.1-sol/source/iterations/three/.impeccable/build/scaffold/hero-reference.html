<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-1.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Gothic:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-headline region text" data-region="headline"><!-- Primary offer heading --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-offer-copy region text" data-region="offer-copy"><!-- Product description paragraph --><p style="font-size:var(--r-offer-copy-font);line-height:1.05;margin:0">offer-copy</p></div>
  <div class="r-primary-action region control" data-region="primary-action"><!-- Primary button and arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop primary-action); a control need not have button chrome --></div>
  <div class="r-wordmark region text" data-region="wordmark"><!-- Product wordmark --><p style="font-size:var(--r-wordmark-font);line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-nav-capture region control" data-region="nav-capture"><!-- Top navigation link capture: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-capture); a control need not have button chrome --></div>
  <div class="r-nav-connect region control" data-region="nav-connect"><!-- Top navigation link connect: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-connect); a control need not have button chrome --></div>
  <div class="r-nav-find region control" data-region="nav-find"><!-- Top navigation link find: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-find); a control need not have button chrome --></div>
  <div class="r-pass-0 region chrome" data-region="pass-0"><!-- Translucent flat color note pass --></div>
  <div class="r-pass-title-0 region text" data-region="pass-title-0"><!-- Capture/context/connection heading --><p style="font-size:var(--r-pass-title-0-font);line-height:1.05;margin:0">pass-title-0</p></div>
  <div class="r-pass-copy-0 region text" data-region="pass-copy-0"><!-- Literal note heading and complete excerpt --><p style="font-size:var(--r-pass-copy-0-font);line-height:1.05;margin:0">pass-copy-0</p></div>
  <div class="r-pass-1 region chrome" data-region="pass-1"><!-- Translucent flat color note pass --></div>
  <div class="r-pass-title-1 region text" data-region="pass-title-1"><!-- Capture/context/connection heading --><p style="font-size:var(--r-pass-title-1-font);line-height:1.05;margin:0">pass-title-1</p></div>
  <div class="r-pass-copy-1 region text" data-region="pass-copy-1"><!-- Literal note heading and complete excerpt --><p style="font-size:var(--r-pass-copy-1-font);line-height:1.05;margin:0">pass-copy-1</p></div>
  <div class="r-pass-2 region chrome" data-region="pass-2"><!-- Translucent flat color note pass --></div>
  <div class="r-pass-title-2 region text" data-region="pass-title-2"><!-- Capture/context/connection heading --><p style="font-size:var(--r-pass-title-2-font);line-height:1.05;margin:0">pass-title-2</p></div>
  <div class="r-pass-copy-2 region text" data-region="pass-copy-2"><!-- Literal note heading and complete excerpt --><p style="font-size:var(--r-pass-copy-2-font);line-height:1.05;margin:0">pass-copy-2</p></div>
  <div class="r-registration region chrome" data-region="registration"><!-- Countable geometric registration marks and pass connection lines --></div>
  <div class="r-offer-layout region chrome" data-region="offer-layout"><!-- Offer grouping with headline, body, action, and closing copy; child regions retain separate IDs --></div>
  <div class="r-navigation-layout region chrome" data-region="navigation-layout"><!-- Top navigation layout and product wordmark; named controls retain separate regions --></div>
  <div class="r-continuation-layout region chrome" data-region="continuation-layout"><!-- Visible continuation section including literal step headings and copy --></div>
</main>
</body>
</html>
